<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Sci-fi neon purple/orange glow filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Beautiful glowing brain emoji as the ultimate cognitive icon -->
  <text x="50%" y="50%" font-size="70" font-family="system-ui, -apple-system, sans-serif" dominant-baseline="central" text-anchor="middle" filter="url(#neon-glow)">🧠</text>
</svg>